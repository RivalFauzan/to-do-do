<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List App</title><script defer="defer" src="main.js"></script></head><body><div class="app-container"><aside class="sidebar"><div class="sidebar-header"><h2>Projects</h2><button id="btn-new-project" class="btn-icon" title="Add Project">+</button></div><ul id="projects-list" class="projects-list"></ul></aside><main class="main-content"><header class="content-header"><h1 id="active-project-title">Inbox</h1><button id="btn-new-todo" class="btn-primary">+ Add Task</button></header><div id="todos-list" class="todos-list"></div></main></div><div id="modal-project" class="modal"><div class="modal-backdrop"></div><div class="modal-content"><button class="modal-close" data-close="modal">&times;</button><h3>New Project</h3><form id="form-project"><label>Project Name <input id="project-name-input" placeholder="e.g. Work, Personal" required></label><div class="modal-actions"><button type="button" class="btn-secondary" data-close="modal">Cancel</button> <button type="submit" class="btn-primary">Create Project</button></div></form></div></div><div id="modal-todo" class="modal"><div class="modal-backdrop"></div><div class="modal-content"><button class="modal-close" data-close="modal">&times;</button><h3>New Task</h3><form id="form-todo"><label>Title <input id="todo-title-input" placeholder="What needs to be done?" required></label> <label>Description <textarea id="todo-desc-input" placeholder="Additional details..."></textarea></label><div class="form-row"><label>Due Date <input type="date" id="todo-date-input"></label> <label>Priority <select id="todo-priority-input"><option value="low">Low</option><option value="medium" selected="selected">Medium</option><option value="high">High</option></select></label></div><div class="modal-actions"><button type="button" class="btn-secondary" data-close="modal">Cancel</button> <button type="submit" class="btn-primary">Add Task</button></div></form></div></div><div id="modal-detail" class="modal"></div></body></html>
